<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- Left: Config Panel -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>TaskPilot</h1>
      </div>

      <div class="sidebar-scroll">
        <!-- Provider -->
        <section class="panel">
          <h2>Provider</h2>
          <div class="provider-grid">
            <button class="provider-btn selected" data-provider="openai" data-url="https://api.openai.com/v1">OpenAI</button>
            <button class="provider-btn" data-provider="deepseek" data-url="https://api.deepseek.com/v1">DeepSeek</button>
            <button class="provider-btn" data-provider="groq" data-url="https://api.groq.com/openai/v1">Groq</button>
            <button class="provider-btn" data-provider="gemini" data-url="https://generativelanguage.googleapis.com/v1beta/openai">Gemini</button>
            <button class="provider-btn" data-provider="anthropic" data-url="https://api.anthropic.com/v1">Anthropic</button>
            <button class="provider-btn" data-provider="mistral" data-url="https://api.mistral.ai/v1">Mistral</button>
            <button class="provider-btn" data-provider="together" data-url="https://api.together.xyz/v1">Together</button>
            <button class="provider-btn" data-provider="openrouter" data-url="https://openrouter.ai/api/v1">OpenRouter</button>
            <button class="provider-btn" data-provider="ollama" data-url="http://localhost:11434/v1">Ollama</button>
          </div>
        </section>

        <!-- Settings -->
        <section class="panel">
          <h2>Settings</h2>
          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" value="gpt-4o-mini">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="maxSteps">Max steps</label>
              <input type="number" id="maxSteps" value="10" min="1" max="50">
            </div>
            <div class="form-group">
              <label for="maxTokens">Token limit</label>
              <input type="number" id="maxTokens" value="0" min="0">
            </div>
          </div>
        </section>

        <!-- Tools -->
        <section class="panel">
          <h2>Tools</h2>
          <div class="tools-list" id="toolsList">
            <label class="tool-toggle">
              <input type="checkbox" data-tool="telegram_send" checked>
              <span class="tool-info"><strong>telegram_send</strong><span class="tool-ctx">Telegram</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="telegram_read" checked>
              <span class="tool-info"><strong>telegram_read</strong><span class="tool-ctx">Telegram</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="browser_open" checked>
              <span class="tool-info"><strong>browser_open</strong><span class="tool-ctx">Chrome</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="browser_search" checked>
              <span class="tool-info"><strong>browser_search</strong><span class="tool-ctx">Chrome</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="terminal_run" checked>
              <span class="tool-info"><strong>terminal_run</strong><span class="tool-ctx">Terminal</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="create_task" checked>
              <span class="tool-info"><strong>create_task</strong><span class="tool-ctx">Task Manager</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="get_weather">
              <span class="tool-info"><strong>get_weather</strong><span class="tool-ctx">Weather API</span></span>
            </label>
            <label class="tool-toggle">
              <input type="checkbox" data-tool="send_email">
              <span class="tool-info"><strong>send_email</strong><span class="tool-ctx">Email</span></span>
            </label>
          </div>
        </section>

        <!-- Goal -->
        <section class="panel">
          <h2>Goal</h2>
          <textarea id="goal" rows="3" placeholder="e.g.: Read Telegram messages, search the web for weather, and create a task"></textarea>
          <button class="btn-start" id="btnStart">Start agent</button>
        </section>
      </div>
    </aside>

    <!-- Right: Dashboard -->
    <main class="dashboard">
      <!-- Top bar -->
      <div class="dash-topbar">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot idle"></span>
          <span id="statusLabel">Idle</span>
        </div>
        <div class="step-counter" id="stepCounter">Step 0 / 10</div>
      </div>

      <!-- Active Workspace -->
      <section class="dash-card workspace-card">
        <h3>Agent Workspace</h3>
        <div class="workspace-channels" id="workspaceChannels">
          <div class="feed-placeholder">Active connections will appear here when the agent starts</div>
        </div>
      </section>

      <!-- Permissions -->
      <section class="dash-card permissions-card collapsed" id="permissionsCard">
        <h3 class="collapsible" id="permToggle">Agent Permissions <span class="collapse-arrow">&#9656;</span></h3>
        <div class="perm-grid" id="permGrid" style="display:none"></div>
      </section>

      <!-- Live Activity + Thoughts -->
      <div class="dash-row dash-row-split">
        <section class="dash-card activity-card">
          <h3>Live Activity</h3>
          <div class="activity-feed" id="activityFeed">
            <div class="feed-placeholder">Events will appear here in real time</div>
          </div>
        </section>

        <section class="dash-card thoughts-card">
          <h3>Agent Thinking</h3>
          <div class="thoughts-feed" id="thoughtsFeed">
            <div class="feed-placeholder">Agent thoughts will appear here</div>
          </div>
        </section>
      </div>

      <!-- Final Answer -->
      <section class="dash-card answer-card" id="answerCard" style="display:none">
        <h3>Final Answer</h3>
        <div id="answerText"></div>
      </section>

      <!-- Run Summary -->
      <section class="dash-card summary-card" id="summaryCard" style="display:none">
        <h3>Run Summary</h3>
        <div id="summaryContent"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
